version: "3.8"

services:
  mt-discord-bot-migrations:
    image: ${DISCORD_BOT_MIGRATIONS_IMAGE:-ghcr.io/pixelados-net/discord-bot-migrations:v1.2.0}
    container_name: mt-discord-bot-migrations
    restart: "no"
    command:
      - --changelog-file=database/changelog.xml
      - --url=jdbc:postgresql://${DISCORD_BOT_POSTGRES_HOST:?DISCORD_BOT_POSTGRES_HOST is required}:${DISCORD_BOT_POSTGRES_PORT:-5432}/${DISCORD_BOT_POSTGRES_DATABASE:?DISCORD_BOT_POSTGRES_DATABASE is required}
      - --username=${DISCORD_BOT_POSTGRES_USER:?DISCORD_BOT_POSTGRES_USER is required}
      - --password=${DISCORD_BOT_POSTGRES_PASSWORD:?DISCORD_BOT_POSTGRES_PASSWORD is required}
      - update
    networks:
      - fl-network

  mt-discord-bot:
    image: ${DISCORD_BOT_IMAGE:-ghcr.io/pixelados-net/discord-bot:v1.2.0}
    container_name: mt-discord-bot
    restart: unless-stopped
    init: true
    depends_on:
      mt-discord-bot-migrations:
        condition: service_completed_successfully
    environment:
      DISCORD_BOT_ENVIRONMENT: production
      DISCORD_BOT_HOST: 0.0.0.0
      DISCORD_BOT_PORT: "3100"
      DISCORD_BOT_LOG_LEVEL: "${DISCORD_BOT_LOG_LEVEL:-info}"
      DISCORD_BOT_LOG_FORMAT: "${DISCORD_BOT_LOG_FORMAT:-json}"

      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}"
      DISCORD_BOT_GUILD_ID: "${DISCORD_BOT_GUILD_ID:?DISCORD_BOT_GUILD_ID is required}"
      DISCORD_BOT_API_KEY: "${DISCORD_BOT_API_KEY:?DISCORD_BOT_API_KEY is required}"
      DISCORD_BOT_HTTP_BODY_LIMIT: "${DISCORD_BOT_HTTP_BODY_LIMIT:-1048576}"

      DISCORD_BOT_PERFORMANCE_ENABLED: "${DISCORD_BOT_PERFORMANCE_ENABLED:-true}"
      DISCORD_BOT_PERFORMANCE_ENDPOINT: "${DISCORD_BOT_PERFORMANCE_ENDPOINT:-http://mt-sarp-scrapper:3000/api/query}"
      DISCORD_BOT_PERFORMANCE_ENDPOINT_TOKEN: "${DISCORD_BOT_PERFORMANCE_ENDPOINT_TOKEN:-}"
      DISCORD_BOT_PERFORMANCE_BUSINESS_ID: "${DISCORD_BOT_PERFORMANCE_BUSINESS_ID:-1995}"
      DISCORD_BOT_PERFORMANCE_CHANNEL_ID: "${DISCORD_BOT_PERFORMANCE_CHANNEL_ID:?DISCORD_BOT_PERFORMANCE_CHANNEL_ID is required}"
      DISCORD_BOT_PERFORMANCE_MESSAGE_KEY: "${DISCORD_BOT_PERFORMANCE_MESSAGE_KEY:-business-performance}"
      DISCORD_BOT_PERFORMANCE_INTERVAL: "${DISCORD_BOT_PERFORMANCE_INTERVAL:-6h}"
      DISCORD_BOT_PERFORMANCE_CUTOFF_WEEKDAY: "${DISCORD_BOT_PERFORMANCE_CUTOFF_WEEKDAY:-Tuesday}"
      DISCORD_BOT_PERFORMANCE_TIMEZONE: "${DISCORD_BOT_PERFORMANCE_TIMEZONE:-America/Bogota}"
      DISCORD_BOT_PERFORMANCE_HTTP_TIMEOUT: "${DISCORD_BOT_PERFORMANCE_HTTP_TIMEOUT:-30s}"
      DISCORD_BOT_PERFORMANCE_MAX_RESPONSE_BYTES: "${DISCORD_BOT_PERFORMANCE_MAX_RESPONSE_BYTES:-2097152}"
      DISCORD_BOT_PERFORMANCE_HISTORY_LIMIT: "${DISCORD_BOT_PERFORMANCE_HISTORY_LIMIT:-104}"

      DISCORD_BOT_POSTGRES_HOST: "${DISCORD_BOT_POSTGRES_HOST:?DISCORD_BOT_POSTGRES_HOST is required}"
      DISCORD_BOT_POSTGRES_PORT: "${DISCORD_BOT_POSTGRES_PORT:-5432}"
      DISCORD_BOT_POSTGRES_DATABASE: "${DISCORD_BOT_POSTGRES_DATABASE:?DISCORD_BOT_POSTGRES_DATABASE is required}"
      DISCORD_BOT_POSTGRES_USER: "${DISCORD_BOT_POSTGRES_USER:?DISCORD_BOT_POSTGRES_USER is required}"
      DISCORD_BOT_POSTGRES_PASSWORD: "${DISCORD_BOT_POSTGRES_PASSWORD:?DISCORD_BOT_POSTGRES_PASSWORD is required}"
      DISCORD_BOT_POSTGRES_SSL_MODE: "${DISCORD_BOT_POSTGRES_SSL_MODE:-disable}"
      DISCORD_BOT_POSTGRES_MAX_CONNS: "${DISCORD_BOT_POSTGRES_MAX_CONNS:-10}"
      DISCORD_BOT_POSTGRES_MIN_CONNS: "${DISCORD_BOT_POSTGRES_MIN_CONNS:-0}"
      DISCORD_BOT_POSTGRES_CONNECT_TIMEOUT: "${DISCORD_BOT_POSTGRES_CONNECT_TIMEOUT:-5s}"
      DISCORD_BOT_POSTGRES_STATEMENT_TIMEOUT: "${DISCORD_BOT_POSTGRES_STATEMENT_TIMEOUT:-5s}"
      DISCORD_BOT_POSTGRES_HEALTH_TIMEOUT: "${DISCORD_BOT_POSTGRES_HEALTH_TIMEOUT:-2s}"
    networks:
      - fl-network

networks:
  fl-network:
    external: true
